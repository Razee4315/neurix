[package]
name = "neurix-tauri"
version = "0.6.2"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Slim feature set: only what we actually use (Mutex, spawn_blocking, fs, AsyncWrite, time).
# Saves binary size vs `full`. Tauri brings its own tokio features as needed.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
simple_logger = "5.0"
# Inference: llama.cpp through its Rust bindings. Pinned exactly because the
# crate tracks llama.cpp closely and minor releases change the API.
# `common` (grammar helpers, +14 MB) and `openmp` are left off: ggml's own
# thread pool is used, so no OpenMP runtime has to ship in the APK.
llama-cpp-2 = { version = "=0.1.159", default-features = false }
# The raw bindings, used only to route llama.cpp's log into the app log.
llama-cpp-sys-2 = "=0.1.159"
# Renders the chat template embedded in each GGUF (the same Jinja the model
# was trained with), so no prompt format is hand-written in this app.
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
fs2 = "0.4"
sha2 = "0.10"
base64 = "0.22"
# Reads the newest Gmail messages on every platform.
mailparse = "0.15"
# Gmail on phones: IMAP over the same rustls (ring) stack reqwest already
# uses, so no OpenSSL has to be cross-compiled for Android.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# Link libc++ statically so the APK does not need to carry libc++_shared.so.
llama-cpp-2 = { version = "=0.1.159", default-features = false, features = ["android-static-stdcxx"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "neurix_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "neurix-tauri"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[workspace]

# Gmail on the desktop: IMAP over the platform TLS. Phones use imap_lite.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
imap = "2.4.1"
native-tls = "0.2"
# PDF and Word files in connected folders. Desktop only, since phones share
# plain text documents, so neither ends up in the APK.
lopdf = { version = "0.42", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
